name: Release No Build

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Build workflow run ID to pull artifacts from"
        required: true
        type: string
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts from build run
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          run-id: ${{ inputs.run-id }}  # pulls artifacts from the build run you specify
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-artifacts/**/*
